<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App</title>
</head>
<body>
    <button onclick="
        changeTxt()
        ">Start</button>

    <button onclick="
        addTextRefreshe()
    ">Add to cart</button>
         
    <div id="elementAdded"></div>



    <button onclick="
        messages++;
        ">Add</button>

    <button onclick="
        messages--;
      ">Remove</button>




    <script>
        function changeTxt(){
            const button = document.querySelector('button');
            setTimeout(function(){
                button.innerHTML = 'Finished!';
            }, 1000);
            button.innerHTML = 'Loading...'
        }

        function addText(){
            let text = document.createElement('p');
            text.innerText = 'Added';
            document.getElementById('elementAdded').appendChild(text);
            setTimeout(function(){
                text.innerText = ''
            }, 2000)
        }
        addText()

        // 12 f

        let timeoutId; 
        function addTextRefreshe(){
            let element = document.getElementById('elementAdded');

            element.innerHTML = '';

            let text = document.createElement('p');
            text.innerText = 'Added';
            element.appendChild(text);

            clearTimeout(timeoutId)

            timeoutId = setTimeout(function(){
                element.innerText = '';
            }, 2000)
        }
        

        // 12 g

        setInterval(function() {
            if(document.title === "App") {
                document.title = "(2) New messages";
            } else {
                document.title = "App";
            }
        }, 1000);


        // 12 h

        let messages = 2;

        setInterval(function() {
            if (document.title === "App") {
                document.title = `(${messages}) New messages`;
            } else {
                document.title = "App";
            }
        }, 1000)

        // 12 j and k
        const multiply = (x, y)  => x * y;

        console.log(multiply(2, 3))
        console.log(multiply(7, 10))

        // 12 l

        function countPositive(nums){
            let positiveNumbers = 0;

            nums.forEach(num => {
                if (num > 0) {
                    positiveNumbers++;
                }
            });
            return positiveNumbers;
        }

        console.log(countPositive([1, -3, 5]))
        console.log(countPositive([-2, 3, -5, 7, 10]))

        // 12 m

        function addNum(array, num) {
            return array.map((value) => value + num);
        }

        console.log(addNum([1, 2, 3], 2))
        console.log(addNum([-2, -1, 0, 99], 2))

        // 12 n

        function removeEgg(foods) {
            return foods.filter((food) => food !== 'egg');
        }

        console.log(removeEgg(['egg', 'apple', 'egg', 'egg', 'ham']))

        // 12 o

        function removeEggs(foods) {
            let eggsRemoved = 0;

            return foods.filter((food) => {
                if (food === 'egg' && eggsRemoved < 2) {
                    eggsRemoved++;
                    return false;
                }
                return true;
            });
        }

        console.log(removeEggs(['egg', 'apple', 'egg', 'egg', 'ham']))




    </script>
</body>
</html>
